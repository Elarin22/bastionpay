<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>휴대폰 본인 인증</title>
  <link rel="stylesheet" th:href="@{/css/bank.css}">
</head>
<body>
<div class="testbed">오픈뱅킹 테스트베드 · 교육용 가짜 은행입니다. 실제 금융 거래가 일어나지 않습니다.</div>
<main>
  <h1>휴대폰 본인 인증</h1>
  <p class="lead"><strong th:text="${clientName}">이용기관</strong>이(가) 계좌 연결을 요청했습니다. 은행에 등록된 휴대폰 번호로 인증번호를 보내 드립니다.</p>
  <form th:action="@{/oauth/2.0/authorize/phone}" method="post">
    <p class="error" role="alert" th:if="${error}" th:text="${error}">오류</p>
    <label>휴대폰 번호
      <input type="text" name="phone" inputmode="numeric" autocomplete="tel-national" placeholder="010-1234-5678" maxlength="13" required autofocus>
    </label>
    <p class="hint">요청하는 권한: <span class="scopes" th:text="${#strings.listJoin(scopeLabels, ', ')}">본인 확인, 계좌 조회</span></p>
    <div class="actions">
      <button type="submit">인증번호 받기</button>
    </div>
  </form>
  <form class="cancel-form" th:action="@{/oauth/2.0/authorize/cancel}" method="post">
    <button class="secondary" type="submit">취소하고 돌아가기</button>
  </form>
</main>
</body>
</html>
