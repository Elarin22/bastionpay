<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>인증번호 입력</title>
  <link rel="stylesheet" th:href="@{/css/bank.css}">
</head>
<body>
<div class="testbed">오픈뱅킹 테스트베드 · 교육용 가짜 은행입니다. 실제 금융 거래가 일어나지 않습니다.</div>
<main>
  <h1>인증번호 입력</h1>
  <p class="lead"><strong th:text="${maskedPhone}">010-****-0000</strong> 번호로 보낸 6자리 인증번호를 <span th:text="${remainingMinutes}">3</span>분 안에 입력해 주세요.</p>
  <form th:action="@{/oauth/2.0/authorize/code}" method="post">
    <p class="error" role="alert" th:if="${error}" th:text="${error}">오류</p>
    <p class="dev-code" th:if="${devCode}">개발용 인증번호 <strong id="dev-code" th:text="${devCode}">123456</strong> <span>(실제 문자는 보내지 않았습니다)</span></p>
    <label>인증번호
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6자리 숫자" required autofocus>
    </label>
    <div class="actions">
      <button type="submit">확인</button>
    </div>
  </form>
  <form class="resend-form" th:action="@{/oauth/2.0/authorize/resend}" method="post">
    <button class="secondary" type="submit">인증번호 다시 받기</button>
    <p class="hint">다시 받으면 이전 인증번호는 쓸 수 없습니다.</p>
  </form>
  <form class="cancel-form" th:action="@{/oauth/2.0/authorize/cancel}" method="post">
    <button class="secondary" type="submit">취소하고 돌아가기</button>
  </form>
</main>
</body>
</html>
