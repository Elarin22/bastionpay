# BastionPay 보안 이벤트(JSONL)를 Graylog 의 Beats 입력(BastionPay-App-Filebeat, 5044)으로 보낸다.
# 실행(프로젝트 루트에서): filebeat -e -c ops/filebeat.yml     (Filebeat 8.x / OSS 계열 Beats 입력과 호환)
# 앱이 쓰는 파일은 logs/security-events.jsonl 이고, 한 줄이 이벤트 하나인 JSON 이다.
filebeat.inputs:
  - type: filestream
    id: bastionpay-security-events
    paths:
      - ${PWD}/logs/security-events.jsonl
    # 기본 파일 식별(핑거프린트)은 파일이 1KB 가 될 때까지 읽지 않는다. 이벤트가 적은 새 파일도 바로 읽도록 inode 로 식별한다
    prospector.scanner.fingerprint.enabled: false
    file_identity.native: ~
    parsers:
      - ndjson:
          target: ""               # JSON 필드를 최상위로 펼친다(event_type, source_ip ...)
          add_error_key: true
          overwrite_keys: true
    fields_under_root: true
    fields:
      app_name: bastionpay          # Graylog 검색 조건 app_name:bastionpay
      environment: lab              # 팀 Graylog 의 'BastionPay Security Events' 스트림이 쓰는 필드(팀원 PC 와 같은 값)
      event_source: bastionpay_security

# 이벤트 시각은 JSON 의 occurred_at(UTC) 을 쓴다
processors:
  - timestamp:
      field: occurred_at
      layouts:
        - '2006-01-02T15:04:05.999999999Z07:00'
        - '2006-01-02T15:04:05Z07:00'
      ignore_missing: true
      ignore_failure: true

output.logstash:                   # Graylog Beats 입력은 logstash(lumberjack) 프로토콜을 쓴다
  hosts: ["192.168.3.17:5044"]
  ssl.enabled: false               # 입력의 TLS 가 꺼져 있다(개발용 내부망)

logging.level: info
