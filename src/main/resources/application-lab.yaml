# Windows 실습 환경 (보안 스택 연동, 5단계)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bastionpay_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

logging:
  file:
    name: logs/bastionpay.log   # Wazuh agent 수집 대상 (JSON 로그는 logback 설정 추가 시)
