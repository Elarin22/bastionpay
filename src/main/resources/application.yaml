spring:
  application:
    name: bastionpay
  profiles:
    default: dev   # IntelliJ에서 프로파일 미지정 시 dev (Mac 개발)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: bastionpay-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000   # 풀에서 커넥션 대기 최대 30초
      idle-timeout: 600000        # 10분
      max-lifetime: 1800000       # 30분 (MySQL wait_timeout보다 짧게)
      validation-timeout: 5000

  jpa:
    open-in-view: false           # 12. JPA 설정
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 담당
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true     # 체크섬 변조 탐지

  thymeleaf:
    cache: true
    mode: HTML

  jackson:
    default-property-inclusion: non_null

server:
  address: ${SERVER_ADDRESS:127.0.0.1}   # 로컬 바인딩 (2-2 LAN 노출 방지)
  port: ${SERVER_PORT:8443}
  shutdown: graceful
  # forward-headers-strategy 미설정(none): X-Forwarded-For 미신뢰 (15-3 MdcLoggingFilter)
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health            # env, heapdump, threaddump, loggers 노출 금지
  endpoint:
    health:
      show-details: never
  # TODO(SecurityConfig 이후): management.server.port 분리 + 127.0.0.1 바인딩

logging:
  level:
    root: INFO
    com.san.bastionpay: INFO

app:
  logging:
    slow-request-ms: 1000          # RequestTimingInterceptor 임계값
  jwt:
    secret: ${JWT_SECRET}          # 환경변수 주입 필수, 커밋 금지
    access-token-ttl: 10m
    refresh-token-ttl: 7d
    cookie:
      secure: true
      same-site: Strict
  openbanking:
    base-url: ${OPENBANKING_BASE_URL:https://testapi.openbanking.or.kr}
    client-id: ${OPENBANKING_CLIENT_ID}
    client-secret: ${OPENBANKING_CLIENT_SECRET}
    redirect-uri: ${OPENBANKING_REDIRECT_URI:https://localhost:8443/openbanking/callback}
