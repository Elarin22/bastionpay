<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  헤더는 로고(왼쪽) · 중요 카테고리(가운데) · 사용자/인증(오른쪽) 3단 배치.
  로그인 후에는 햄버거 버튼이 모든 항목을 카테고리별로 펼치는 "전체 메뉴"를 연다.
-->
<div th:fragment="header" class="site-top">
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" th:href="${currentMember != null} ? @{/dashboard} : @{/}" aria-label="BastionPay 홈">
        <svg class="brand__mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false"><path fill="currentColor" d="M5 28V8h5v4h3V8h6v4h3V8h5v20h-5v-8a6 6 0 0 0-12 0v8z"/></svg>
        <span class="brand__name">BastionPay</span>
      </a>

      <!-- 로그인 전: 가운데 카테고리 + 오른쪽 로그인/회원가입. 좁은 화면에서는 햄버거 드롭다운 -->
      <th:block th:if="${currentMember == null}">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          <span class="menu-toggle__label">메뉴</span>
          <span class="menu-toggle__bars" aria-hidden="true"></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="주요 메뉴">
          <ul class="site-nav__list">
            <li><a th:href="@{/#service}">서비스 소개</a></li>
            <li><a th:href="@{/#features}">주요 기능</a></li>
            <li><a th:href="@{/#start}">시작하기</a></li>
          </ul>
          <div class="site-nav__auth">
            <a class="auth-link" th:href="@{/login}">로그인</a>
            <a class="auth-link auth-link--strong" th:href="@{/signup}">회원가입</a>
          </div>
        </nav>
      </th:block>

      <!-- 로그인 후: 가운데 중요 카테고리 + 오른쪽 사용자 + 전체 메뉴 버튼 -->
      <th:block th:if="${currentMember != null}">
        <nav class="site-nav-center" aria-label="주요 메뉴">
          <ul class="site-nav__list">
            <li><a th:href="@{/dashboard}" th:classappend="${activeNav == 'dashboard'} ? 'is-active'" th:attr="aria-current=${activeNav == 'dashboard'} ? 'page'">대시보드</a></li>
            <li><a th:href="@{/transfer}" th:classappend="${activeNav == 'transfer'} ? 'is-active'" th:attr="aria-current=${activeNav == 'transfer'} ? 'page'">이체</a></li>
            <li><a th:href="@{/transactions}" th:classappend="${activeNav == 'transactions'} ? 'is-active'" th:attr="aria-current=${activeNav == 'transactions'} ? 'page'">거래내역</a></li>
          </ul>
        </nav>
        <div class="site-actions">
          <span class="auth-user"><strong th:text="${currentMember.nickname}">닉네임</strong>님</span>
          <form class="auth-form" th:action="@{/logout}" method="post">
            <button class="auth-link auth-link--button" type="submit">로그아웃</button>
          </form>
          <button class="menu-toggle menu-toggle--mega" type="button" aria-expanded="false" aria-controls="mega-menu" aria-label="전체 메뉴">
            <span class="menu-toggle__bars" aria-hidden="true"></span>
          </button>
        </div>
      </th:block>
    </div>

    <!-- 전체 메뉴: 모든 항목을 카테고리별로 보여 준다 (app.js 가 열고 닫는다) -->
    <div class="mega" id="mega-menu" th:if="${currentMember != null}" hidden>
      <div class="wrap mega__inner">
        <section class="mega__group" aria-labelledby="mega-use">
          <h2 class="mega__title" id="mega-use">이용</h2>
          <ul class="mega__list">
            <li><a th:href="@{/dashboard}" th:attr="aria-current=${activeNav == 'dashboard'} ? 'page'"><span class="mega__name">대시보드</span><span class="mega__desc">자산 현황 한눈에 보기</span></a></li>
            <li><a th:href="@{/transfer}" th:attr="aria-current=${activeNav == 'transfer'} ? 'page'"><span class="mega__name">이체</span><span class="mega__desc">입력, 확인, 완료 3단계</span></a></li>
            <li><a th:href="@{/transactions}" th:attr="aria-current=${activeNav == 'transactions'} ? 'page'"><span class="mega__name">거래내역</span><span class="mega__desc">전체 계좌 입출금 조회</span></a></li>
          </ul>
        </section>
        <section class="mega__group" aria-labelledby="mega-assets">
          <h2 class="mega__title" id="mega-assets">자산</h2>
          <ul class="mega__list">
            <li><a th:href="@{/accounts}" th:attr="aria-current=${activeNav == 'accounts'} ? 'page'"><span class="mega__name">입출금 계좌</span><span class="mega__desc">연동 계좌 잔액과 거래내역</span></a></li>
            <li><a th:href="@{/deposits}" th:attr="aria-current=${activeNav == 'deposits'} ? 'page'"><span class="mega__name">예금</span><span class="mega__desc">가입 상품과 만기일</span></a></li>
            <li><a th:href="@{/savings}" th:attr="aria-current=${activeNav == 'savings'} ? 'page'"><span class="mega__name">적금</span><span class="mega__desc">납입 현황과 만기일</span></a></li>
            <li><a th:href="@{/virtual-accounts}" th:attr="aria-current=${activeNav == 'virtual'} ? 'page'"><span class="mega__name">가상계좌</span><span class="mega__desc">내 가상계좌와 원장 내역</span></a></li>
          </ul>
        </section>
        <section class="mega__group" aria-labelledby="mega-connect">
          <h2 class="mega__title" id="mega-connect">연결</h2>
          <ul class="mega__list">
            <li><a th:href="@{/connect}" th:attr="aria-current=${activeNav == 'connect'} ? 'page'"><span class="mega__name">오픈뱅킹 연결</span><span class="mega__desc">다른 은행 계좌 연결하기</span></a></li>
          </ul>
        </section>
        <div class="mega__foot">
          <span class="auth-user"><strong th:text="${currentMember.nickname}">닉네임</strong>님</span>
          <form class="auth-form" th:action="@{/logout}" method="post">
            <button class="auth-link auth-link--button" type="submit">로그아웃</button>
          </form>
        </div>
      </div>
    </div>
  </header>
</div>
</body>
</html>
