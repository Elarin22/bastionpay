<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('대시보드', 'app-ui')}"></head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/appnote :: note}"></div>
<main id="main" class="app">
  <div class="wrap">
    <div class="app__inner">
      <div class="app__head">
        <h1><span th:text="${currentMember.nickname}">닉네임</span>님의 자산</h1>
        <p>종류별 합계만 보여 드립니다. 항목을 누르면 상세 내역을 볼 수 있습니다.</p>
      </div>

      <section class="block" aria-labelledby="h-assets">
        <div class="block__head"><h2 id="h-assets">자산 현황</h2></div>
        <ul class="rows rows--lg">
          <li>
            <a class="row row--nav" th:href="@{/accounts}">
              <span class="row__main"><strong>입출금 계좌</strong><small th:text="${linkedCount} + '개 계좌'">3개 계좌</small></span>
              <span class="row__end"><span class="amount" th:text="${#numbers.formatInteger(totalLinked, 3, 'COMMA')} + '원'">0원</span><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 10h11m-4-4 4 4-4 4"/></svg></span>
            </a>
          </li>
          <li>
            <a class="row row--nav" th:href="@{/deposits}">
              <span class="row__main"><strong>예금</strong><small th:text="${depositCount} + '개 상품'">2개 상품</small></span>
              <span class="row__end"><span class="amount" th:text="${#numbers.formatInteger(totalDeposits, 3, 'COMMA')} + '원'">0원</span><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 10h11m-4-4 4 4-4 4"/></svg></span>
            </a>
          </li>
          <li>
            <a class="row row--nav" th:href="@{/savings}">
              <span class="row__main"><strong>적금</strong><small th:text="${savingCount} + '개 상품'">2개 상품</small></span>
              <span class="row__end"><span class="amount" th:text="${#numbers.formatInteger(totalSavings, 3, 'COMMA')} + '원'">0원</span><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 10h11m-4-4 4 4-4 4"/></svg></span>
            </a>
          </li>
          <li>
            <a class="row row--nav" th:href="@{/virtual-accounts}">
              <span class="row__main"><strong>가상계좌</strong><small th:text="${virtualCount} + '개 계좌'">2개 계좌</small></span>
              <span class="row__end"><span class="amount" th:text="${#numbers.formatInteger(totalVirtual, 3, 'COMMA')} + '원'">0원</span><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 10h11m-4-4 4 4-4 4"/></svg></span>
            </a>
          </li>
          <li class="row row--sum"><span>총 자산</span><span class="amount" th:text="${#numbers.formatInteger(grandTotal, 3, 'COMMA')} + '원'">0원</span></li>
        </ul>
      </section>

      <section class="block block--gap" aria-labelledby="h-go">
        <div class="block__head"><h2 id="h-go">바로가기</h2></div>
        <ul class="start__links start__links--plain">
          <li><a class="start-link start-link--primary" th:href="@{/transfer}"><span>이체하기</span><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 10h11m-4-4 4 4-4 4"/></svg></a></li>
          <li><a class="start-link" th:href="@{/transactions}"><span>전체 거래내역</span><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 10h11m-4-4 4 4-4 4"/></svg></a></li>
        </ul>
      </section>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
