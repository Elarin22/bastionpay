<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('적금', 'app-ui')}"></head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/appnote :: note}"></div>
<main id="main" class="app">
  <div class="wrap">
    <div class="app__inner">
      <div class="app__head">
        <h1>적금</h1>
        <p>가입한 적금 상품입니다. 납입 진행 상황과 만기일을 확인하세요.</p>
      </div>
      <section class="block" aria-labelledby="h-s">
        <div class="block__head"><h2 id="h-s">가입 상품 <span class="count" th:text="${savings.size()} + '개'">2개</span></h2></div>
        <ul class="rows">
          <li class="product" th:each="s : ${savings}">
            <div class="product__top">
              <span class="row__main"><strong th:text="${s.bank} + ' ' + ${s.name}">상품</strong><small class="num-text" th:text="${s.maskedNumber}">130-***-000000</small></span>
              <span class="amount" th:text="${#numbers.formatInteger(s.balance, 3, 'COMMA')} + '원'">0원</span>
            </div>
            <div class="progress" role="img" th:attr="aria-label=${s.total} + '회 중 ' + ${s.paid} + '회 납입'">
              <progress th:max="${s.total}" th:value="${s.paid}"></progress>
              <span class="num-text" th:text="${s.paid} + ' / ' + ${s.total} + '회 납입'">7 / 12회 납입</span>
            </div>
            <dl class="meta">
              <div><dt>월 납입액</dt><dd th:text="${#numbers.formatInteger(s.monthly, 3, 'COMMA')} + '원'">300,000원</dd></div>
              <div><dt>연 금리</dt><dd th:text="${s.rate} + '%'">3.90%</dd></div>
              <div><dt>만기일</dt><dd th:text="${#temporals.format(s.maturityDate, 'yyyy.MM.dd')}">2027.01.01</dd></div>
            </dl>
          </li>
          <li class="row row--sum"><span>합계</span><span class="amount" th:text="${#numbers.formatInteger(total, 3, 'COMMA')} + '원'">0원</span></li>
        </ul>
      </section>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
