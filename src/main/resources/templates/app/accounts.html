<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('입출금 계좌', 'app-ui,auth')}"></head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/appnote :: note}"></div>
<main id="main" class="app">
  <div class="wrap">
    <div class="app__inner">
      <div class="app__head">
        <h1>입출금 계좌</h1>
        <p>오픈뱅킹으로 연결한 계좌입니다. 계좌를 선택하면 잔액과 거래내역을 볼 수 있습니다.</p>
      </div>

      <p class="notice notice--error" role="alert" th:if="${error}" th:text="${error}">오류</p>

      <th:block th:unless="${linked}"><div th:replace="~{fragments/notlinked :: prompt}"></div></th:block>

      <th:block th:if="${linked and rows != null}">
        <section class="block" aria-labelledby="h-list">
          <div class="block__head"><h2 id="h-list">연결된 계좌 <span class="count" th:text="${rows.size()} + '개'">3개</span></h2></div>
          <p class="empty" th:if="${rows.isEmpty()}">오픈뱅킹에 등록된 계좌가 없습니다.</p>
          <ul class="rows" th:unless="${rows.isEmpty()}">
            <li th:each="r : ${rows}" class="row row--account">
              <a class="row__link" th:href="@{/accounts/{f}(f=${r.account.fintechUseNum})}">
                <span class="row__main"><strong th:text="${r.account.bankName} + ' ' + ${r.account.alias}">은행 별칭</strong><small class="num-text" th:text="${r.account.maskedNumber}">110-***-000000</small></span>
                <span class="amount" th:if="${r.balance != null}" th:text="${#numbers.formatInteger(r.balance, 3, 'COMMA')} + '원'">0원</span>
                <small th:if="${r.balance == null}">잔액 확인 불가</small>
              </a>
            </li>
            <li class="row row--sum" th:if="${total != null}"><span>합계</span><span class="amount" th:text="${#numbers.formatInteger(total, 3, 'COMMA')} + '원'">0원</span></li>
          </ul>
          <p class="field__hint" th:if="${balanceMissing}">일부 계좌의 잔액을 가져오지 못해 합계를 표시하지 않았습니다. 잔액 조회에는 이용기관코드(<code>OPENBANKING_ORG_CODE</code>) 설정이 필요합니다.</p>
        </section>
        <ul class="start__links start__links--plain block--gap">
          <li><a class="start-link" th:href="@{/connect}"><span>오픈뱅킹 연결 관리</span><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 10h11m-4-4 4 4-4 4"/></svg></a></li>
        </ul>
      </th:block>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
