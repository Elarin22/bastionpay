<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('입출금 계좌', 'app-ui')}"></head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/appnote :: note}"></div>
<main id="main" class="app">
  <div class="wrap">
    <div class="app__inner">
      <div class="app__head">
        <h1>입출금 계좌</h1>
        <p>오픈뱅킹으로 연결한 계좌입니다. 계좌를 선택하면 잔액과 거래내역을 볼 수 있습니다.</p>
      </div>
      <section class="block" aria-labelledby="h-list">
        <div class="block__head"><h2 id="h-list">등록된 계좌 <span class="count" th:text="${linked.size()} + '개'">3개</span></h2></div>
        <ul class="rows">
          <li th:each="a : ${linked}" class="row row--account">
            <a class="row__link" th:href="@{/accounts/{id}(id=${a.id})}">
              <span class="row__main"><strong th:text="${a.bank} + ' ' + ${a.alias}">은행 별칭</strong><small class="num-text" th:text="${a.maskedNumber}">110-***-000000</small></span>
              <span class="amount" th:text="${#numbers.formatInteger(a.balance, 3, 'COMMA')} + '원'">0원</span>
            </a>
            <a class="row__action" th:href="@{/transfer(from=${a.id})}">이체</a>
          </li>
          <li class="row row--sum"><span>합계</span><span class="amount" th:text="${#numbers.formatInteger(totalLinked, 3, 'COMMA')} + '원'">0원</span></li>
        </ul>
      </section>
      <ul class="start__links start__links--plain block--gap">
        <li><a class="start-link" th:href="@{/connect}"><span>다른 은행 계좌 연결하기</span><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 10h11m-4-4 4 4-4 4"/></svg></a></li>
      </ul>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
