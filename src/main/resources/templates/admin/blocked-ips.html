<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('차단 IP', 'app-ui,auth')}"></head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{fragments/header :: header}"></div>
<main id="main" class="app">
  <div class="wrap">
    <div class="app__inner app__inner--wide">
      <div class="app__head">
        <h1>보안 관리</h1>
        <p>차단한 IP 의 요청은 앱에 닿기 전에 403 으로 거부됩니다. 차단과 해제는 모두 감사 기록에 남습니다.</p>
      </div>
      <div th:replace="~{admin/tabs :: tabs(${tab})}"></div>

      <p class="notice" role="status" th:if="${notice}" th:text="${notice}">안내</p>

      <section class="block" aria-labelledby="h-block">
        <div class="block__head"><h2 id="h-block">IP 차단</h2></div>
        <form class="filters" method="post" th:action="@{/admin/security/blocked-ips}">
          <div class="field">
            <label for="ip">차단할 IP</label>
            <input id="ip" name="ip" type="text" required maxlength="45" autocomplete="off" placeholder="203.0.113.9">
          </div>
          <div class="field">
            <label for="reason">사유 <span class="optional">선택</span></label>
            <input id="reason" name="reason" type="text" maxlength="200" autocomplete="off" placeholder="예: 로그인 무차별 대입">
          </div>
          <button class="btn-solid" type="submit">차단</button>
        </form>
        <p class="field__hint">지금 접속한 내 IP(<span class="num-text" th:text="${myIp} ?: '알 수 없음'">127.0.0.1</span>)는 차단할 수 없습니다. 차단하면 이 화면도 쓸 수 없게 됩니다.</p>
      </section>

      <section class="block block--gap" aria-labelledby="h-list">
        <div class="block__head"><h2 id="h-list">차단 목록 <span class="count" th:text="${total} + '개'">0개</span></h2></div>
        <form class="filters" method="get" th:action="@{/admin/security/blocked-ips}">
          <div class="field">
            <label for="q">검색</label>
            <input id="q" name="q" type="search" th:value="${q}" maxlength="100" autocomplete="off" placeholder="IP·사유·차단한 사람">
          </div>
          <button class="btn-line" type="submit">검색</button>
        </form>
        <p class="empty" th:if="${rows.isEmpty()}">차단한 IP 가 없습니다.</p>
        <table class="tx" th:unless="${rows.isEmpty()}">
          <caption class="sr-only">차단된 IP</caption>
          <thead><tr><th scope="col">IP</th><th scope="col">사유</th><th scope="col">차단한 사람</th><th scope="col">차단 시각(KST)</th><th scope="col"><span class="sr-only">해제</span></th></tr></thead>
          <tbody>
            <tr th:each="r : ${rows}">
              <td class="num-text" data-label="IP"><strong th:text="${r.ip}">203.0.113.9</strong></td>
              <td data-label="사유" th:text="${r.reason} ?: '-'">사유</td>
              <td data-label="차단한 사람" th:text="${r.blockedBy}">admin_test</td>
              <td class="tx__date" data-label="차단 시각" th:text="${r.blockedAt}">10.21 16:00:00</td>
              <td data-label="">
                <form method="post" th:action="@{/admin/security/blocked-ips/unblock}">
                  <input type="hidden" name="ip" th:value="${r.ip}">
                  <button class="row__action" type="submit">해제</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
        <div th:replace="~{fragments/pager :: pager(${pager})}"></div>
      </section>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
